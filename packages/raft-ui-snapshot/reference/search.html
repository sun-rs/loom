    <symbol id="i-trash" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18"/><path d="M19 6v14c0 1-1 2-2 2H7c-1 0-2-1-2-2V6"/><path d="M8 6V4c0-1 1-2 2-2h4c1 0 2 1 2 2v2"/><line x1="10" x2="10" y1="11" y2="17"/><line x1="14" x2="14" y1="11" y2="17"/></symbol>
    <symbol id="i-check-circle" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21.801 10A10 10 0 1 1 17 3.335"/><path d="m9 11 3 3L22 4"/></symbol>
    <symbol id="i-user-plus" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><line x1="19" x2="19" y1="8" y2="14"/><line x1="22" x2="16" y1="11" y2="11"/></symbol>
    <symbol id="i-graph" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="4.5" r="2.5"/><path d="m10.2 6.3-3.9 3.9"/><circle cx="4.5" cy="12" r="2.5"/><path d="M7 12h10"/><circle cx="19.5" cy="12" r="2.5"/><path d="m13.8 17.7 3.9-3.9"/><circle cx="12" cy="19.5" r="2.5"/></symbol>
    <symbol id="i-terminal" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="4 17 10 11 4 5"/><line x1="12" x2="20" y1="19" y2="19"/></symbol>
    <symbol id="i-more" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="1"/><circle cx="19" cy="12" r="1"/><circle cx="5" cy="12" r="1"/></symbol>
  </defs>
</svg>

<div class="search-app">

  <!-- icon rail（与 index.html 相同，is-active 在搜索） -->
  <nav class="rail" aria-label="主导航">
    <div class="rail-head"><a class="rail-logo" href="slack.html" aria-label="返回聊天">H</a></div>
    <div class="rail-primary">
      <a class="rail-btn is-active" href="search.html" title="搜索"><svg><use href="#i-search"/></svg></a>
      <a class="rail-btn" href="slack.html" title="聊天"><svg><use href="#i-chat"/></svg></a>
      <a class="rail-btn" href="activity.html" title="动态"><svg><use href="#i-pulse"/></svg></a>
      <a class="rail-btn" href="tasks.html" title="任务"><svg><use href="#i-task"/></svg></a>
      <a class="rail-btn" href="agents.html" title="成员"><svg><use href="#i-members"/></svg></a>
      <a class="rail-btn" href="computers.html" title="计算机"><svg><use href="#i-monitor"/></svg></a>
    </div>
    <div class="rail-footer-item"><a class="rail-btn" href="#" title="通知"><svg><use href="#i-bell"/></svg></a></div>
    <div class="rail-footer-item"><a class="rail-btn" href="#" title="帮助"><svg><use href="#i-help"/></svg></a></div>
    <div class="rail-footer-item"><a class="rail-btn" href="settings.html" title="设置"><svg><use href="#i-gear"/></svg></a></div>
  </nav>

  <!-- 搜索主区 -->
  <main class="search-main">

    <!-- 官方 Search surface：独立黄底图标 + 黑框输入容器 -->
    <header class="search-top">
      <div class="search-title-slot">
        <span class="search-icon-box" aria-hidden="true"><svg><use href="#i-search"/></svg></span>
        <div class="search-box">
          <input id="searchInput" type="text" placeholder="搜索频道、私信、消息…   ⌘K" aria-label="搜索频道、私信、消息" autocomplete="off">
          <kbd class="search-kbd">ESC</kbd>
        </div>
      </div>
    </header>

    <!-- 过滤器行 -->
    <div class="filter-bar">
      <div class="filter-group">

        <div class="filter-item" data-filter>
          <button class="btn filter-btn" id="btnSender" data-default="发送者" aria-haspopup="true">
            <svg><use href="#i-members"/></svg>
            <span class="f-label">发送者</span>
            <svg class="chev"><use href="#i-chevron"/></svg>
          </button>
          <div class="dropdown-panel" id="panelSender" hidden>
            <p class="dropdown-label">发送者</p>
            <div class="dropdown-search"><input class="input" type="text" placeholder="搜索成员"></div>
            <button class="dropdown-row" data-value="我">
              <span class="avatar sm"><svg><use href="#av-user"/></svg></span>
              <span class="row-name">我</span>
              <svg class="check"><use href="#i-check"/></svg>
            </button>
            <button class="dropdown-row" data-value="Alice">
              <span class="avatar sm"><svg><use href="#av-robot"/></svg></span>
              <span class="row-name">Alice</span>
              <svg class="check"><use href="#i-check"/></svg>
            </button>
            <button class="dropdown-row" data-value="Cindy">
              <span class="avatar sm"><svg><use href="#av-cat"/></svg></span>
              <span class="row-name">Cindy</span>
              <svg class="check"><use href="#i-check"/></svg>
            </button>
          </div>
        </div>

        <div class="filter-item" data-filter>
          <button class="btn filter-btn" id="btnScope" data-default="范围" aria-haspopup="true">
            <span class="f-glyph">@</span>
            <span class="f-label">范围</span>
            <svg class="chev"><use href="#i-chevron"/></svg>
          </button>
          <div class="dropdown-panel" id="panelScope" hidden>
            <p class="dropdown-label">范围</p>
            <button class="dropdown-row" data-value="@我"><span class="row-name">@我</span><svg class="check"><use href="#i-check"/></svg></button>
            <button class="dropdown-row" data-value="人类"><span class="row-name">人类</span><svg class="check"><use href="#i-check"/></svg></button>
            <button class="dropdown-row" data-value="Agent"><span class="row-name">Agent</span><svg class="check"><use href="#i-check"/></svg></button>
          </div>
        </div>

        <div class="filter-item" data-filter>
          <button class="btn filter-btn" id="btnChannel" data-default="频道" aria-haspopup="true">
            <span class="f-glyph">#</span>
            <span class="f-label">频道</span>
            <svg class="chev"><use href="#i-chevron"/></svg>
          </button>
          <div class="dropdown-panel" id="panelChannel" hidden>
            <p class="dropdown-label">频道</p>
            <div class="dropdown-search"><input class="input" type="text" placeholder="搜索频道"></div>
            <button class="dropdown-row" data-value="#all">
              <span class="hash">#</span>
              <span class="row-name">all</span>
              <svg class="check"><use href="#i-check"/></svg>
            </button>
            <button class="dropdown-row" data-value="#onboarding-owner">
              <svg class="hash-icon"><use href="#i-lock"/></svg>
              <span class="row-name">onboarding-owner</span>
              <svg class="check"><use href="#i-check"/></svg>
            </button>
          </div>
        </div>

        <div class="filter-item" data-filter>
          <button class="btn filter-btn" id="btnTime" data-default="不限时间" aria-haspopup="true">
            <svg><use href="#i-clock"/></svg>
            <span class="f-label">不限时间</span>
            <svg class="chev"><use href="#i-chevron"/></svg>
          </button>
          <div class="dropdown-panel" id="panelTime" hidden>
            <p class="dropdown-label">时间</p>
            <button class="dropdown-row is-selected" data-value="不限时间"><span class="row-name">不限时间</span><svg class="check"><use href="#i-check"/></svg></button>
            <button class="dropdown-row" data-value="今天"><span class="row-name">今天</span><svg class="check"><use href="#i-check"/></svg></button>
            <button class="dropdown-row" data-value="最近 7 天"><span class="row-name">最近 7 天</span><svg class="check"><use href="#i-check"/></svg></button>
            <button class="dropdown-row" data-value="最近 30 天"><span class="row-name">最近 30 天</span><svg class="check"><use href="#i-check"/></svg></button>
          </div>
        </div>
      </div>

      <div class="filter-item sort">
        <button class="btn filter-btn" id="btnSort" data-default="相关度" disabled>
          <svg><use href="#i-sort"/></svg>
          <span class="f-label">相关度</span>
        </button>
      </div>
      <button class="clear-filters" id="clearFilters" type="button">清除筛选</button>
    </div>

    <!-- 内容区：空状态 / 结果列表 -->
    <section class="search-stage">
      <div class="empty-state" id="emptyState">
        <div class="empty-icon"><svg><use href="#i-search"/></svg></div>
        <h1>搜索所有内容</h1>
        <p>搜索频道、私信、人类成员、Agent 和消息历史。</p>
      </div>
      <div class="result-list" id="resultList" hidden></div>
    </section>
  </main>
</div>

<script src="ui/raft-ui-runtime.js"></script>
<script src="ui/raft-ui-reference-adapter.js"></script>
<script src="ui/raft-ui-primitives.js"></script>
<script src="ui/raft-ui-shell.js"></script>
<script src="search.js"></script>
</body>
</html>
