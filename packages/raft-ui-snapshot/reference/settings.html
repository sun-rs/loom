    <symbol id="i-trash" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18"/><path d="M19 6v14c0 1-1 2-2 2H7c-1 0-2-1-2-2V6"/><path d="M8 6V4c0-1 1-2 2-2h4c1 0 2 1 2 2v2"/><line x1="10" x2="10" y1="11" y2="17"/><line x1="14" x2="14" y1="11" y2="17"/></symbol>
    <symbol id="i-check-circle" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21.801 10A10 10 0 1 1 17 3.335"/><path d="m9 11 3 3L22 4"/></symbol>
    <symbol id="i-user-plus" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><line x1="19" x2="19" y1="8" y2="14"/><line x1="22" x2="16" y1="11" y2="11"/></symbol>
    <symbol id="i-graph" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="4.5" r="2.5"/><path d="m10.2 6.3-3.9 3.9"/><circle cx="4.5" cy="12" r="2.5"/><path d="M7 12h10"/><circle cx="19.5" cy="12" r="2.5"/><path d="m13.8 17.7 3.9-3.9"/><circle cx="12" cy="19.5" r="2.5"/></symbol>
    <symbol id="i-terminal" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="4 17 10 11 4 5"/><line x1="12" x2="20" y1="19" y2="19"/></symbol>

<div class="page" id="app">

  <!-- 1 ─ icon rail ─────────────────────────────────────────── -->
  <nav class="rail" aria-label="主导航">
    <div class="rail-head"><a class="rail-logo" href="slack.html" aria-label="返回聊天">H</a></div>
    <div class="rail-primary">
      <a class="rail-btn" href="search.html" title="搜索"><svg><use href="#i-search"/></svg></a>
      <a class="rail-btn" href="slack.html" title="聊天"><svg><use href="#i-chat"/></svg></a>
      <a class="rail-btn" href="activity.html" title="动态"><svg><use href="#i-pulse"/></svg></a>
      <a class="rail-btn" href="tasks.html" title="任务"><svg><use href="#i-task"/></svg></a>
      <a class="rail-btn" href="agents.html" title="成员"><svg><use href="#i-members"/></svg></a>
      <a class="rail-btn" href="computers.html" title="计算机"><svg><use href="#i-monitor"/></svg></a>
    </div>
    <div class="rail-footer-item"><a class="rail-btn" href="#" title="通知"><svg><use href="#i-bell"/></svg></a></div>
    <div class="rail-footer-item"><a class="rail-btn" href="#" title="帮助"><svg><use href="#i-help"/></svg></a></div>
    <div class="rail-footer-item"><a class="rail-btn is-active" href="settings.html" title="设置"><svg><use href="#i-gear"/></svg></a></div>
  </nav>

  <!-- 2 ─ 设置左导航 ────────────────────────────────────────── -->
  <aside class="sec-sidebar">
    <header class="sec-head">设置</header>
    <div class="sec-body">
      <section class="side-section">
        <div class="sec-group">个人</div>
        <button class="channel-row is-selected"><svg class="row-icon"><use href="#i-user-plus"/></svg> 账户</button>
        <button class="channel-row"><svg class="row-icon"><use href="#i-globe"/></svg> 语言与区域</button>
        <button class="channel-row"><svg class="row-icon"><use href="#i-image"/></svg> 外观</button>
        <button class="channel-row"><svg class="row-icon"><use href="#i-bell"/></svg> 通知</button>
      </section>
      <section class="side-section">
        <div class="sec-group">工作空间</div>
        <button class="channel-row"><svg class="row-icon"><use href="#i-monitor"/></svg> 服务器资料</button>
        <a class="channel-row" href="billing.html"><svg class="row-icon"><use href="#i-doc"/></svg> 套餐与账单</a>
        <a class="channel-row" href="admin.html"><svg class="row-icon"><use href="#i-lock"/></svg> 管理</a>
        <button class="channel-row"><svg class="row-icon"><use href="#i-kanban"/></svg> 应用</button>
        <button class="channel-row"><svg class="row-icon"><use href="#i-terminal"/></svg> MCP 服务器</button>
      </section>
      <section class="side-section">
        <div class="sec-group">资源</div>
        <button class="channel-row"><svg class="row-icon"><use href="#i-help"/></svg> 关于</button>
        <button class="channel-row"><svg class="row-icon"><use href="#i-doc"/></svg> 文档</button>
        <button class="channel-row"><svg class="row-icon"><use href="#i-chat"/></svg> 反馈</button>
        <button class="channel-row"><svg class="row-icon"><use href="#i-list"/></svg> 更新日志</button>
      </section>
    </div>
  </aside>

  <!-- 3 ─ 设置主区：账户 ────────────────────────────────────── -->
  <main class="settings-main">
    <header class="settings-head"><h1>账户</h1></header>

    <div class="settings-wrap">

      <!-- 资料 -->
      <section class="card" aria-label="资料">
        <div class="profile-top">
          <span class="avatar avatar-xl"><svg><use href="#av-user"/></svg></span>
          <div class="profile-id">
            <b class="profile-name">Hakase</b>
            <p class="profile-handle">@hakase · 所有者</p>
          </div>
        </div>
        <div class="field">
          <label for="fName">名字</label>
          <input class="input" id="fName" value="Hakase">
        </div>
        <div class="field">
          <label for="fHandle">用户名</label>
          <div class="input-wrap">
            <span class="prefix">@</span>
            <input id="fHandle" value="hakase">
          </div>
        </div>
        <div class="field">
          <label for="fMail">邮箱</label>
          <div class="input-wrap">
            <input id="fMail" value="hakase@example.com">
            <span class="chip chip-green"><svg><use href="#i-check-circle"/></svg>已验证</span>
          </div>
        </div>
      </section>

      <!-- 已连接账户 -->
      <section class="card" aria-label="已连接账户">
        <h2 class="card-title">已连接账户</h2>
        <div class="acct-row">
          <span class="acct-icon tint-yellow">G</span>
          <b>Google</b>
          <span class="acct-actions">
            <span class="chip chip-gray">已连接</span>
            <button class="btn" data-account-provider="google" data-account-operation="disconnect">断开</button>
          </span>
        </div>
        <div class="acct-row">
          <span class="acct-icon tint-gray">G</span>
          <b>GitHub</b>
          <span class="acct-actions">
            <button class="btn" data-account-provider="github" data-account-operation="connect">连接</button>
          </span>
        </div>
        <div class="acct-row">
          <span class="acct-icon tint-lavender">A</span>
          <b>Apple</b>
          <span class="acct-actions">
            <button class="btn" data-account-provider="apple" data-account-operation="connect">连接</button>
          </span>
        </div>
      </section>

      <!-- 会话 -->
      <section class="card" aria-label="会话">
        <h2 class="card-title">会话</h2>
        <div class="session-row">
          <span class="acct-icon"><svg class="acct-svg"><use href="#i-monitor"/></svg></span>
          <div class="session-info">
            <div class="session-name"><b>Mac Studio</b><span class="chip chip-green">当前会话</span></div>
            <p class="session-sub">macOS · 今天 09:41 活跃</p>
          </div>
        </div>
        <div class="card-foot">
          <button class="btn" data-settings-action="revoke-sessions">退出所有其他会话</button>
        </div>
      </section>

      <!-- 语言与区域（演示 select / segmented / checkbox 三个标准件） -->
      <section class="card" aria-label="语言与区域">
        <h2 class="card-title">语言与区域</h2>
        <div class="field">
          <label for="langSelect">显示语言</label>
          <p class="hint">选择应用界面的显示语言。这与消息翻译无关。</p>
          <span class="select-wrap">
            <select class="select" id="langSelect">
              <option>简体中文</option>
              <option>English</option>
              <option>日本語</option>
            </select>
            <svg><use href="#i-chevron"/></svg>
          </span>
        </div>
        <div class="field">
          <label>翻译模式</label>
          <p class="hint">自动会翻译可见消息；手动会在消息菜单中提供翻译；关闭则仅显示原文。</p>
          <div class="segmented" role="group" aria-label="翻译模式">
            <button class="seg-btn">自动</button>
            <button class="seg-btn">手动</button>
            <button class="seg-btn is-active">关闭</button>
          </div>
        </div>
        <div class="field">
          <label>时间格式</label>
          <div class="segmented" role="group" aria-label="时间格式">
            <button class="seg-btn">12 小时制</button>
            <button class="seg-btn is-active">24 小时制</button>
          </div>
        </div>
        <label class="checkbox"><input type="checkbox" checked><span class="box"></span>加入前需同意协议（checkbox 标准件演示）</label>
        <div class="card-foot">
          <button class="btn btn-pink" data-settings-action="save-preferences">保存</button>
        </div>
      </section>

      <!-- 修改密码（折叠） -->
      <div class="collapse" id="pwCollapse">
        <button class="collapse-head" id="pwToggle" aria-expanded="false">
          <span>修改密码</span>
          <svg class="chev"><use href="#i-chevron"/></svg>
        </button>
        <div class="collapse-body">
          <div class="field">
            <label for="pwOld">当前密码</label>
            <input class="input" id="pwOld" type="password" placeholder="输入当前密码">
          </div>
          <div class="field">
            <label for="pwNew">新密码</label>
            <input class="input" id="pwNew" type="password" placeholder="至少 8 个字符">
          </div>
          <button class="btn btn-pink" data-settings-action="save-password">保存密码</button>
        </div>
      </div>

      <div class="save-row">
        <button class="btn btn-pink" data-settings-action="save-profile">保存更改</button>
      </div>

    </div>
  </main>
</div>
