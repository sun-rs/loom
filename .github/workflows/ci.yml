name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npx playwright install --with-deps firefox
      - run: npm run test:web:foundations
        timeout-minutes: 3
      - run: npm run test:web:browser
        timeout-minutes: 5
      - run: npm run format:check
