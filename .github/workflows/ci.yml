name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Free efficiency tests read the immutable historical workload.
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('package-lock.json') }}
          restore-keys: ${{ runner.os }}-playwright-
      - name: Install Playwright engines
        run: ./node_modules/.bin/playwright install --with-deps chromium
      - name: Install system Chrome channel
        run: ./node_modules/.bin/playwright install --with-deps chrome
      - run: npm run check
      - run: npm ci --ignore-scripts --prefix frontends/raft
      - run: npm run build:official-web
      - run: npm run test:official-web:browser
        timeout-minutes: 3
      - run: npm run build:official-web:channel
      - run: npm run test:official-web:channel
        timeout-minutes: 5
      - run: npm run test:console:browser
        timeout-minutes: 15
      - run: npm run format:check
